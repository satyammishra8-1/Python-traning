<body>

    <div class="card">
        <h1 id="question">Do you like me? 💖</h1>
        <p id="subtext">Be honest... I promise I won't bite! 😊</p>
        <div class="btn-group">
            <button id="yesBtn">Yes 😍</button>
            <button id="noBtn">No 🙈</button>
        </div>
    </div>

    <script>
        const yesBtn = document.getElementById('yesBtn');
        const noBtn = document.getElementById('noBtn');
        const question = document.getElementById('question');
        const subtext = document.getElementById('subtext');

        const romanticEmojis = ['❤️', '💖', '🥰', '😍', '💕', '🌹', '✨', '💘', '💓'];
        let isFloating = false;
        let currentX = 0;
        let currentY = 0;

        function moveAwayFromPointer(pointerX, pointerY, forceMove = false) {
            const rect = noBtn.getBoundingClientRect();
            const btnCenterX = rect.left + rect.width / 2;
            const btnCenterY = rect.top + rect.height / 2;

            let deltaX = btnCenterX - pointerX;
            let deltaY = btnCenterY - pointerY;
            const distance = Math.hypot(deltaX, deltaY);

            // Smaller trigger radius on narrow phone screens
            const triggerRadius = window.innerWidth < 500 ? 75 : 85;

            if (forceMove || distance < triggerRadius) {
                if (!isFloating) {
                    currentX = rect.left;
                    currentY = rect.top;
                    document.body.appendChild(noBtn);
                    noBtn.style.position = 'fixed';
                    noBtn.style.left = currentX + 'px';
                    noBtn.style.top = currentY + 'px';
                    isFloating = true;
                }

                // If tapped directly on center, pick a random escape angle
                const angle = (deltaX === 0 && deltaY === 0)
                    ? Math.random() * Math.PI * 2
                    : Math.atan2(deltaY, deltaX);

                const pushDistance = window.innerWidth < 500 ? 70 : 75;
                let newX = currentX + Math.cos(angle) * pushDistance;
                let newY = currentY + Math.sin(angle) * pushDistance;

                const padding = 16;
                const maxX = window.innerWidth - noBtn.offsetWidth - padding;
                const maxY = window.innerHeight - noBtn.offsetHeight - padding;

                // Sidestep inward if cornered near any screen edge
                if (newX < padding) newX = padding + 65;
                if (newX > maxX) newX = maxX - 65;
                if (newY < padding) newY = padding + 65;
                if (newY > maxY) newY = maxY - 65;

                // Hard clamp inside visible screen
                currentX = Math.max(padding, Math.min(maxX, newX));
                currentY = Math.max(padding, Math.min(maxY, newY));

                noBtn.style.left = currentX + 'px';
                noBtn.style.top = currentY + 'px';
            }
        }

        // Desktop cursor movement
        document.addEventListener('mousemove', (e) => {
            if (noBtn.style.display !== 'none') {
                moveAwayFromPointer(e.clientX, e.clientY);
            }
        });

        // Smartphone finger drag near the button
        document.addEventListener('touchmove', (e) => {
            if (noBtn.style.display !== 'none' && e.touches.length > 0) {
                const touch = e.touches[0];
                moveAwayFromPointer(touch.clientX, touch.clientY);
            }
        }, { passive: true });

        // Smartphone direct tap on the "No" button
        noBtn.addEventListener('touchstart', (e) => {
            e.preventDefault(); // Prevents accidental click on mobile
            const touch = e.touches[0];
            moveAwayFromPointer(touch.clientX, touch.clientY, true);
        }, { passive: false });

        // Keep inside viewport on orientation change / resize
        window.addEventListener('resize', () => {
            if (isFloating) {
                const padding = 16;
                const maxX = window.innerWidth - noBtn.offsetWidth - padding;
                const maxY = window.innerHeight - noBtn.offsetHeight - padding;
                currentX = Math.max(padding, Math.min(maxX, currentX));
                currentY = Math.max(padding, Math.min(maxY, currentY));
                noBtn.style.left = currentX + 'px';
                noBtn.style.top = currentY + 'px';
            }
        });

        // Spawn floating romantic emojis when "Yes" is tapped/clicked
        yesBtn.addEventListener('click', () => {
            question.innerText = "Yay!! I like you too! 🥰❤️";
            subtext.innerText = "You just made my day! ✨";
            noBtn.style.display = 'none';

            for (let i = 0; i < 35; i++) {
                setTimeout(createEmoji, i * 100);
            }
        });

        function createEmoji() {
            const emoji = document.createElement('div');
            emoji.classList.add('emoji');
            emoji.innerText = romanticEmojis[Math.floor(Math.random() * romanticEmojis.length)];
            emoji.style.left = Math.random() * 90 + 'vw';
            emoji.style.animationDuration = (Math.random() * 2 + 2.5) + 's';
            document.body.appendChild(emoji);

            setTimeout(() => {
                emoji.remove();
            }, 4500);
        }
    </script>
